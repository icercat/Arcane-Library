name: Build ATM0 Arcane Library 0.2.3
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rebuild and verify JAR
        run: bash scripts/build.sh
      - name: Run mock regression tests
        run: bash tests/run_mock_tests.sh
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATM0-Arcane-Library-0.2.3
          path: build/ATM0-Arcane-Library-0.2.3.jar
          if-no-files-found: error
      - name: Package patch-based source
        run: |
          zip -q -r ATM0-Arcane-Library-0.2.3-source.zip src tools scripts tests vendor docs .github README.md
      - name: Publish source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATM0-Arcane-Library-0.2.3-source
          path: ATM0-Arcane-Library-0.2.3-source.zip
          if-no-files-found: error
      - name: Commit successfully compiled JAR
        if: github.ref == 'refs/heads/main'
        run: |
          cp build/ATM0-Arcane-Library-0.2.3.jar dist/ATM0-Arcane-Library-0.2.3.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ATM0-Arcane-Library-0.2.3.jar
          if ! git diff --cached --quiet; then
            git commit -m "Build 0.2.3 candidate JAR [skip ci]"
            git push
          fi
